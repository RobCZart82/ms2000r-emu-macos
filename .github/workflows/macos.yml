name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
      PACKAGE_VERSION: 1.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build VST3, AU and standalone
        run: |
          test "$(uname -m)" = "$ARCH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DMS2K_BUILD_VST3=ON -DMS2K_MAC_GUI=ON
          cmake --build build --target MS2000R_Shim MS2000R_AUShim MS2000R_app MS2000R_HostTest --parallel 3
      - name: Check VST3 and AU loader regressions
        run: bash packaging/check-macos-loaders.sh build
      - name: Assemble installer and verify its payload
        run: |
          ./packaging/macos-pkg.sh build "$ARCH" "$PACKAGE_VERSION" packages
          pkgutil --expand-full "packages/MS2000R-macOS-v$PACKAGE_VERSION-$ARCH.pkg" "$RUNNER_TEMP/expanded"
          python3 - "$RUNNER_TEMP/expanded" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          root = Path(sys.argv[1])
          distribution = ET.parse(root / "Distribution")
          options = distribution.find("options").attrib
          assert options["hostArchitectures"] == os.environ["ARCH"]
          assert options["customize"] == "always"

          components = {
              "vst3": ("MS2000R.vst3", "/Library/Audio/Plug-Ins/VST3"),
              "au": ("MS2000R.component", "/Library/Audio/Plug-Ins/Components"),
              "standalone": ("MS2000R.app", "/Applications"),
          }
          assert [entry.attrib["choice"] for entry in distribution.findall("choices-outline/line")] == list(components)
          for name, (bundle, location) in components.items():
              package = root / f"{name}.pkg"
              info = ET.parse(package / "PackageInfo").getroot()
              assert info.attrib["install-location"] == location
              assert info.attrib["version"] == os.environ["PACKAGE_VERSION"]
              payload = package / "Payload"
              assert [entry.name for entry in payload.iterdir()] == [bundle]
              subprocess.run(["codesign", "--verify", "--deep", "--strict", str(payload / bundle)], check=True)
          PY
      - name: Verify independent installer choices
        run: python3 packaging/check-macos-choices.py "packages/MS2000R-macOS-v$PACKAGE_VERSION-$ARCH.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-pkg-${{ matrix.arch }}
          path: packages/*.pkg
          if-no-files-found: error
          retention-days: 7
